<style>
/* ── Reset & Base (matches FLUX wealth) ─────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;height:-webkit-fill-available;background:#030308;overflow:hidden;}
body{
  height:100vh;height:100dvh;height:-webkit-fill-available;overflow:hidden;
  color:#f0f0ff;font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  overscroll-behavior:none;background:#030308;
}
#root{height:100%;overflow:hidden;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#33335c;border-radius:2px;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
input,select,textarea{-webkit-appearance:none;-moz-appearance:none;border-radius:0;}
*{-webkit-tap-highlight-color:transparent;}
button{cursor:pointer;font-family:inherit;}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideUp{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
.fade-up{animation:fadeUp .28s ease forwards;}
.slide-up{animation:slideUp .32s cubic-bezier(.16,1,.3,1) forwards;}

.app{
  max-width:100%;height:100vh;height:-webkit-fill-available;height:100dvh;margin:0 auto;
  background:#030308;
  background-image:
    radial-gradient(circle at 15% 0%, rgba(179,71,255,0.12) 0%, transparent 45%),
    radial-gradient(circle at 100% 30%, rgba(0,212,255,0.08) 0%, transparent 50%),
    radial-gradient(circle at 0% 100%, rgba(255,46,232,0.07) 0%, transparent 45%);
  display:flex;flex-direction:column;position:relative;overflow:hidden;
}

/* Top bar */
.top-bar{
  position:relative;z-index:250;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 16px) 16px 14px;
  background:rgba(3,3,8,0.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid #1f1f38;flex-shrink:0;
}
.top-bar-word{
  font-family:'Orbitron',system-ui,sans-serif;font-size:16px;font-weight:800;color:#f0f0ff;
  letter-spacing:.6px;display:flex;align-items:center;gap:7px;text-shadow:0 0 14px rgba(0,255,179,0.4);
}
.top-bar-word .sub{font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:600;color:#00ffb3;letter-spacing:.16em;text-transform:uppercase;opacity:.85;}
.top-bar-icon{width:26px;height:26px;flex-shrink:0;filter:drop-shadow(0 0 5px rgba(0,255,179,.6));}
.top-bar-word .top-bar-bolt-svg{width:28px;height:12px;overflow:visible;flex-shrink:0;}
.top-bar-word .top-bar-bolt-svg path{fill:none;stroke-width:9;stroke-linecap:round;stroke-dasharray:60 180;animation:topBarInfinityCycle 5.6s ease-in-out infinite,topBarGlowPulse 5.6s ease-in-out infinite;}
@keyframes topBarInfinityCycle{
  0%{stroke-dasharray:60 180;stroke-dashoffset:0;}
  38%{stroke-dasharray:231 0;stroke-dashoffset:0;}
  50%{stroke-dasharray:231 0;stroke-dashoffset:0;}
  88%{stroke-dasharray:60 180;stroke-dashoffset:-231;}
  100%{stroke-dasharray:60 180;stroke-dashoffset:-240;}
}
@keyframes topBarGlowPulse{0%,100%{filter:drop-shadow(0 0 3px rgba(0,255,179,0.5));}50%{filter:drop-shadow(0 0 8px rgba(255,46,232,0.75));}}
.top-bar-btn{
  width:38px;height:38px;border-radius:12px;border:1px solid #33335c;background:rgba(179,71,255,.1);
  display:flex;align-items:center;justify-content:center;color:#b347ff;
}
.saved-dot{width:6px;height:6px;border-radius:50%;background:#00ffb3;position:fixed;top:18px;right:18px;z-index:260;opacity:0;transition:opacity .3s;box-shadow:0 0 8px #00ffb3;}
.saved-dot.show{opacity:1;}

/* Page header */
.ph{padding:18px 20px 14px;position:relative;}
.ph-title{font-family:'Orbitron',system-ui,sans-serif;font-size:21px;font-weight:800;color:#f0f0ff;letter-spacing:.3px;line-height:1.2;text-shadow:0 0 18px rgba(0,255,179,0.3);}
.ph-sub{font-family:'Space Grotesk',system-ui,sans-serif;font-size:9px;font-weight:500;color:#5a5a80;letter-spacing:.14em;text-transform:uppercase;margin-top:4px;}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 124px;}

/* Bottom dock */
.dock-wrap{position:fixed;left:0;right:0;bottom:0;z-index:190;display:flex;justify-content:center;padding:0 16px calc(18px + env(safe-area-inset-bottom));pointer-events:none;}
.dock{pointer-events:auto;display:flex;align-items:center;gap:4px;background:rgba(18,10,34,0.82);border:1px solid #33335c;border-radius:30px;padding:7px 8px;box-shadow:0 0 0 1px rgba(179,71,255,0.15),0 8px 32px rgba(0,0,0,.6),0 0 24px rgba(179,71,255,0.18);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);max-width:100%;}
.dock-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:56px;height:46px;border-radius:22px;border:none;background:transparent;flex-shrink:0;transition:all .2s;}
.dock-btn-icon{display:flex;align-items:center;justify-content:center;color:#9494c0;filter:drop-shadow(0 0 4px rgba(0,255,179,0.5));}
.dock-btn-label{font-family:'Space Grotesk',sans-serif;font-size:7px;font-weight:700;letter-spacing:.04em;color:#5a5a80;text-transform:uppercase;}
.dock-btn.on .dock-btn-icon{color:#00ffb3;}
.dock-btn.on .dock-btn-label{color:#00ffb3;}
.dock-btn.home{background:linear-gradient(145deg,#00ffb3,#00d4ff);width:54px;height:54px;border-radius:50%;margin:-4px 2px 0;box-shadow:0 0 0 4px rgba(3,3,8,1),0 0 18px rgba(0,255,179,0.65),0 0 36px rgba(0,255,179,0.3);}
.dock-btn.home .dock-btn-icon{color:#030308;filter:none;}
.dock-btn.home .dock-btn-label{display:none;}
.dock-btn.menu{background:rgba(179,71,255,0.12);border:1px solid rgba(179,71,255,0.3);}
.dock-btn.menu .dock-btn-icon{color:#b347ff;filter:drop-shadow(0 0 6px #b347ff);}
.dock-btn.menu.on{background:rgba(179,71,255,0.28);border-color:#b347ff;}
.dock-btn:active{background:rgba(255,255,255,0.06);}

/* Nav rail */
.nav-backdrop{position:fixed;inset:0;z-index:198;background:rgba(2,2,6,.7);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
@keyframes traySlideUp{from{transform:translateY(100%);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes trayHideDown{from{transform:translateY(0);opacity:1;}to{transform:translateY(100%);opacity:0;}}
.nav-rail{position:fixed;left:0;right:0;bottom:0;z-index:199;max-height:70vh;background:linear-gradient(165deg,#0d0d18,#030308);border:1px solid #33335c;border-bottom:none;border-radius:26px 26px 0 0;box-shadow:0 0 0 1px rgba(179,71,255,0.12),0 -8px 40px rgba(0,0,0,.7);padding:14px 0 calc(24px + env(safe-area-inset-bottom));overflow-y:auto;animation:traySlideUp .26s cubic-bezier(.16,1,.3,1) forwards;}
.nav-rail.hiding{animation:trayHideDown .2s ease forwards;}
.nav-rail-handle{width:36px;height:4px;border-radius:3px;background:#33335c;margin:0 auto 14px;}
.nav-rail-title{font-family:'Space Grotesk',sans-serif;font-size:8px;font-weight:700;color:#5a5a80;letter-spacing:.18em;text-transform:uppercase;padding:0 20px 10px;margin-bottom:4px;border-bottom:1px solid #1f1f38;}
.nav-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:10px 12px 4px;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:1px solid transparent;background:none;width:100%;text-align:center;border-radius:16px;transition:background .15s,border-color .15s;}
.nav-item:active{background:rgba(255,255,255,0.04);}
.nav-item.on{border-color:rgba(0,255,179,0.4);background:rgba(0,255,179,0.08);}
.nav-item-icon{display:flex;align-items:center;justify-content:center;color:#9494c0;filter:drop-shadow(0 0 4px rgba(179,71,255,0.35));}
.nav-item-label{font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:600;color:#9494c0;letter-spacing:.02em;}
.nav-item.on .nav-item-icon{color:#00ffb3;filter:drop-shadow(0 0 8px #00ffb3);}
.nav-item.on .nav-item-label{color:#00ffb3;}

/* Cards / buttons / forms (shared tokens) */
.card{background:#0a0a14;border:1px solid #1f1f38;border-radius:14px;padding:16px;margin-bottom:10px;}
.card-raised{background:#12121e;border:1px solid #33335c;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:10px;font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:.06em;font-weight:700;border:1px solid transparent;transition:all .18s;text-transform:uppercase;}
.btn-green{background:linear-gradient(135deg,#00ffb3,#00d4ff);color:#030308;border-color:#00ffb3;box-shadow:0 0 16px rgba(0,255,179,.4);}
.btn-pink{background:linear-gradient(135deg,#ff2ee8,#b347ff);color:#030308;border-color:#ff2ee8;box-shadow:0 0 16px rgba(255,46,232,.4);}
.btn-ghost{background:transparent;color:#f0f0ff;border-color:#33335c;}
.btn-red{background:transparent;color:#ff2255;border-color:#ff2255;}
.btn-yellow{background:rgba(245,255,0,.1);color:#f5ff00;border-color:rgba(245,255,0,.35);}
.btn-sm{padding:6px 12px;font-size:10px;}
.btn-xs{padding:4px 8px;font-size:8px;letter-spacing:.03em;border-radius:7px;}
.btn-icon{padding:4px 7px;font-size:12px;border-radius:7px;line-height:1;}
.btn-full{width:100%;}
.btn:disabled{opacity:.4;}
.fl{margin-bottom:14px;}
.fl label{display:block;font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#5a5a80;margin-bottom:6px;}
.fi{width:100%;padding:11px 13px;background:#12121e;border:1px solid #1f1f38;border-radius:10px;font-family:'Inter',sans-serif;font-size:14px;color:#f0f0ff;outline:none;transition:border-color .2s,box-shadow .2s;}
.fi:focus{border-color:#00ffb3;box-shadow:0 0 0 3px rgba(0,255,179,0.12);}
textarea.fi{resize:none;line-height:1.6;}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:600;letter-spacing:.04em;white-space:nowrap;}
.badge-mint{background:rgba(0,255,179,.1);color:#00ffb3;border:1px solid rgba(0,255,179,.3);}
.badge-cyan{background:rgba(0,212,255,.1);color:#00d4ff;border:1px solid rgba(0,212,255,.3);}
.badge-pink{background:rgba(255,46,232,.1);color:#ff2ee8;border:1px solid rgba(255,46,232,.3);}
.badge-purple{background:rgba(179,71,255,.1);color:#b347ff;border:1px solid rgba(179,71,255,.3);}
.badge-yellow{background:rgba(245,255,0,.08);color:#f5ff00;border:1px solid rgba(245,255,0,.22);}
.badge-dim{background:rgba(148,148,192,.08);color:#9494c0;border:1px solid #33335c;}
.hr{height:1px;background:#1f1f38;margin:14px 0;}
.pt{width:100%;background:#1f1f38;border-radius:3px;overflow:hidden;}
.pf{border-radius:3px;transition:width .3s ease;}
.overlay{position:fixed;inset:0;background:rgba(2,2,6,.86);z-index:200;display:flex;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
.sheet{background:linear-gradient(165deg,#0d0d18,#030308);border:1px solid #33335c;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:90vh;max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:fadeUp .22s ease forwards;display:flex;flex-direction:column;box-shadow:0 0 0 1px rgba(179,71,255,.12),0 -24px 60px rgba(0,0,0,.7);}
.modal-top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;}
.modal-top-bar h2{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:800;color:#f0f0ff;flex:1;}
.tabs{display:flex;background:#12121e;border-radius:11px;padding:3px;gap:2px;border:1px solid #1f1f38;margin-bottom:16px;}
.tab{flex:1;padding:8px;text-align:center;font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:9px;border:none;background:transparent;color:#5a5a80;transition:all .2s;}
.tab.on{background:#0a0a14;color:#00ffb3;border:1px solid rgba(0,255,179,.3);}
.stat-box{background:#0a0a14;border:1px solid #1f1f38;border-radius:12px;padding:13px 14px;}
.neon-num{font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:.2px;}
.flux-label{font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:#00ffb3;margin-bottom:6px;display:block;}
.empty-state{text-align:center;padding:40px 20px;color:#5a5a80;}
.empty-state-icon{font-size:34px;margin-bottom:10px;opacity:.6;}
.empty-state-title{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;color:#9494c0;letter-spacing:.04em;margin-bottom:4px;}
.empty-state-sub{font-family:'Inter',sans-serif;font-size:11px;color:#5a5a80;line-height:1.5;}

/* Category chip scroller */
.chip-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;-webkit-overflow-scrolling:touch;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid #1f1f38;background:#0a0a14;font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;letter-spacing:.04em;color:#9494c0;white-space:nowrap;}
.chip.on{border-color:#00ffb3;background:rgba(0,255,179,.1);color:#00ffb3;}

/* Recipe list */
.letter-head{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:800;color:#5a5a80;letter-spacing:.1em;margin:14px 0 8px;padding-left:2px;}
.letter-head:first-child{margin-top:0;}
.recipe-row{display:flex;align-items:center;padding:12px 13px;border-radius:12px;border:1px solid #1f1f38;background:#0a0a14;margin-bottom:7px;gap:11px;transition:all .15s;}
.recipe-row:active{background:#12121e;border-color:#33335c;}
.recipe-emoji{width:40px;height:40px;border-radius:10px;background:#12121e;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.recipe-title{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:#f0f0ff;margin-bottom:4px;}
.recipe-tags{display:flex;gap:5px;flex-wrap:wrap;}
.fab{position:fixed;right:18px;bottom:calc(96px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#00ffb3,#00d4ff);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(3,3,8,.9),0 6px 22px rgba(0,255,179,.45);z-index:120;border:none;color:#030308;}

/* Ingredient / step rows in forms */
.dyn-row{display:flex;gap:7px;align-items:center;margin-bottom:8px;}
.dyn-row .fi{flex:1;}
.dyn-row .rm-btn{flex-shrink:0;width:34px;height:34px;border-radius:9px;border:1px solid #1f1f38;background:#0a0a14;color:#ff2255;display:flex;align-items:center;justify-content:center;}
.add-row-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border-radius:10px;border:1px dashed #33335c;background:transparent;color:#9494c0;font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:14px;}

/* Focus mode (recipe detail) */
.focus-step{background:#0a0a14;border:1px solid #1f1f38;border-radius:16px;padding:20px;margin-bottom:12px;}
.focus-step-num{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:800;color:#00ffb3;letter-spacing:.14em;margin-bottom:8px;}
.focus-step-text{font-family:'Inter',sans-serif;font-size:15px;line-height:1.65;color:#f0f0ff;}
.timer-chip{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:7px 13px;border-radius:20px;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.35);color:#00d4ff;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;}
.timer-chip.running{background:rgba(255,46,232,.12);border-color:#ff2ee8;color:#ff2ee8;}
.ing-check-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #1f1f38;}
.ing-check{width:20px;height:20px;border-radius:6px;border:1.5px solid #33335c;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.ing-check.on{background:#00ffb3;border-color:#00ffb3;color:#030308;}
.ing-text{font-family:'Inter',sans-serif;font-size:13px;color:#f0f0ff;}
.ing-text.on{color:#5a5a80;text-decoration:line-through;}

/* Fasting ambient ring */
.fast-ring-wrap{display:flex;flex-direction:column;align-items:center;padding:20px 0 6px;}
.fast-ring-time{font-family:'Orbitron',sans-serif;font-size:34px;font-weight:800;color:#f0f0ff;text-shadow:0 0 22px rgba(0,255,179,.35);}
.fast-ring-label{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#5a5a80;margin-top:4px;}
.fast-ring-sub{font-family:'Space Grotesk',sans-serif;font-size:10px;color:#9494c0;margin-top:10px;text-align:center;line-height:1.6;}
.milestone-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #1f1f38;}
.milestone-row:last-child{border-bottom:none;}
.milestone-dot{width:26px;height:26px;border-radius:50%;background:#12121e;border:1px solid #33335c;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;}
.milestone-dot.hit{background:rgba(0,255,179,.12);border-color:#00ffb3;color:#00ffb3;}
.milestone-h{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;color:#9494c0;}
.milestone-h.hit{color:#00ffb3;}
.milestone-d{font-family:'Inter',sans-serif;font-size:11px;color:#5a5a80;margin-top:1px;}

/* Splash */

@keyframes splashFadeOut{0%{opacity:1;}80%{opacity:1;}100%{opacity:0;pointer-events:none;}}
@keyframes infinityDraw{to{stroke-dashoffset:0;}}
@keyframes ballGlow{0%,100%{filter:drop-shadow(0 0 6px #00ffb3) drop-shadow(0 0 12px #00d4ff);}50%{filter:drop-shadow(0 0 10px #00d4ff) drop-shadow(0 0 18px #ff2ee8);}}

.splash-credit span{color:#00ffb3;opacity:.7;}

<body>
<div id="root"></div>
<script>
"use strict";
var h = React.createElement;
var useState = React.useState, useEffect = React.useEffect, useMemo = React.useMemo, useRef = React.useRef;

/* ══════════════════════════════ Persistence ══════════════════════════════ */
/* Mirrors FLUX Wealth's architecture: localStorage as the synchronous read layer,
   IndexedDB as a write-through backup for capacity beyond the 5MB ls cap. Uses its
   own DB name and key prefix so it can sit next to FLUX Wealth without collisions. */
var _fhDB = null;
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function(){}); }
(function(){
  try{
    var req = indexedDB.open('FLUXHealth_backup', 1);
    req.onupgradeneeded = function(e){ e.target.result.createObjectStore('kv'); };
    req.onsuccess = function(e){
      _fhDB = e.target.result;
      try{
        var tx = _fhDB.transaction('kv','readonly');
        var cursor = tx.objectStore('kv').openCursor();
        cursor.onsuccess = function(ev){
          var cur = ev.target.result; if (!cur) return;
          var k = cur.key;
          if (k && k.indexOf('fluxh_')===0 && !localStorage.getItem(k)) { try{ localStorage.setItem(k, cur.value); }catch(e2){} }
          cur.continue();
        };
      }catch(e3){}
    };
  }catch(e){}
})();
function _idbSet(key, value){
  if (!_fhDB) return;
  try{ var tx = _fhDB.transaction('kv','readwrite'); tx.objectStore('kv').put(value, 'fluxh_'+key); }catch(e){}
}
function lsGet(key, fallback){
  try{ var v = localStorage.getItem('fluxh_'+key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function lsSet(key, value){
  try{
    var serialized = JSON.stringify(value);
    localStorage.setItem('fluxh_'+key, serialized);
    _idbSet(key, serialized);
    window.dispatchEvent(new CustomEvent('fluxh-saved'));
  }catch(e){
    var existing = document.getElementById('fluxh-storage-warn');
    if (!existing){
      var warn = document.createElement('div');
      warn.id = 'fluxh-storage-warn';
      warn.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;background:#ff2255;color:#fff;padding:10px 18px;border-radius:10px;font-family:Space Grotesk,sans-serif;font-size:12px;font-weight:700;letter-spacing:.04em;box-shadow:0 4px 20px rgba(255,34,85,.6);max-width:90vw;text-align:center;';
      warn.textContent = '\u26A0 Storage full — data may not be saved.';
      document.body.appendChild(warn);
      setTimeout(function(){ warn.remove(); }, 6000);
    }
  }
}

/* Auto Backup — a single consolidated "safety snapshot" of everything, separate from the
   per-key IndexedDB mirroring above. Written automatically whenever the app is backgrounded,
   and available as a manual button. This is FLUX Health's own writer (built fresh for this
   app's own data — recipes, fasting, logs, pantry, Flux Reset — not a reuse of FLUX Wealth's
   finance-specific snapshot function, which has no equivalent fields here). Not a substitute
   for a real exported backup file: it only lives in this browser and disappears if site data
   is cleared, same caveat as the IndexedDB mirror. */
function writeHealthAutoBackupSnapshot(){
  var data = {};
  for (var i=0;i<localStorage.length;i++){
    var k = localStorage.key(i);
    if (k && k.indexOf("fluxh_")===0 && k!=="fluxh_autoBackupSnapshot" && k!=="fluxh_lastAutoBackup"){
      try{ data[k] = JSON.parse(localStorage.getItem(k)); }catch(e){}
    }
  }
  var now = new Date().toISOString();
  var snapshot = { app:"FLUX Health", savedAt:now, data:data };
  localStorage.setItem("fluxh_autoBackupSnapshot", JSON.stringify(snapshot));
  localStorage.setItem("fluxh_lastAutoBackup", JSON.stringify(now));
  return now;
}
function restoreHealthAutoBackupSnapshot(){
  var raw = localStorage.getItem("fluxh_autoBackupSnapshot");
  if (!raw) return null;
  var snapshot;
  try{ snapshot = JSON.parse(raw); }catch(e){ return null; }
  if (!snapshot || snapshot.app!=="FLUX Health" || !snapshot.data) return null;
  Object.keys(snapshot.data).forEach(function(k){
    if (k.indexOf("fluxh_")===0) localStorage.setItem(k, JSON.stringify(snapshot.data[k]));
  });
  return snapshot.savedAt;
}

/* Real, downloadable backup file — explicitly tagged "FLUX Health" in both the payload and the
   filename so it's never mixed up with a FLUX Wealth (finance) backup file if someone has both
   apps installed. Shared by the Home screen button and Settings so there's one source of truth. */
function exportHealthBackupFile(){
  var data = {};
  for (var i=0;i<localStorage.length;i++){
    var k = localStorage.key(i);
    if (k && k.indexOf("fluxh_")===0) data[k] = JSON.parse(localStorage.getItem(k));
  }
  var payload = { app:"FLUX Health", version:1, exportedAt:new Date().toISOString(), data:data };
  var blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "FLUX-Health-Backup-"+todayStr()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

/* Apple Health "export.xml" import. HealthKit itself has no web API at all — a browser page
   can never read Apple Health directly, live sync isn't possible here. This instead reads the
   file a person gets from Health app → profile icon → Export All Health Data, which is a real
   (if manual) way to pull that history in. Scans for just the record types we use via regex
   rather than building a full XML DOM, since these exports can run into hundreds of MB. */
function parseAppleHealthExport(xmlText){
  var stepsByDate = {}, waterByDate = {}, sleepByDate = {}, weightByDate = {};
  var recordRe = /<Record\b[^>]*\/>/g;
  var m;
  while ((m = recordRe.exec(xmlText))){
    var tag = m[0];
    var isSteps = tag.indexOf("HKQuantityTypeIdentifierStepCount")>-1;
    var isWeight = tag.indexOf("HKQuantityTypeIdentifierBodyMass")>-1;
    var isWater = tag.indexOf("HKQuantityTypeIdentifierDietaryWater")>-1;
    var isSleep = tag.indexOf("HKCategoryTypeIdentifierSleepAnalysis")>-1;
    if (!isSteps && !isWeight && !isWater && !isSleep) continue;

    var startM = tag.match(/\sstartDate="([^"]+)"/);
    if (!startM) continue;
    var dateKey = startM[1].slice(0,10);
    var valM = tag.match(/\svalue="([^"]+)"/);
    var unitM = tag.match(/\sunit="([^"]+)"/);

    if (isSteps && valM){
      var n = parseFloat(valM[1]);
      if (!isNaN(n)) stepsByDate[dateKey] = (stepsByDate[dateKey]||0) + n;
    } else if (isWeight && valM){
      var w = parseFloat(valM[1]);
      var unit = unitM ? unitM[1] : "lb";
      if (unit.toLowerCase()==="kg") w = w * 2.20462;
      if (!isNaN(w)){
        if (!weightByDate[dateKey]) weightByDate[dateKey] = [];
        weightByDate[dateKey].push(w);
      }
    } else if (isWater && valM){
      var oz = parseFloat(valM[1]);
      var wUnit = (unitM ? unitM[1] : "fl_oz_us").toLowerCase();
      if (wUnit.indexOf("ml")>-1) oz = oz / 29.5735;
      else if (wUnit==="l") oz = oz * 33.814;
      if (!isNaN(oz)) waterByDate[dateKey] = (waterByDate[dateKey]||0) + oz;
    } else if (isSleep){
      var isAsleep = valM && valM[1].indexOf("Asleep")>-1;
      var endM = tag.match(/\sendDate="([^"]+)"/);
      if (isAsleep && endM){
        var sd = new Date(startM[1].replace(" ","T").replace(" ",""));
        var ed = new Date(endM[1].replace(" ","T").replace(" ",""));
        var hrs = (ed - sd) / 3600000;
        if (hrs>0 && hrs<24 && !isNaN(sd.getTime())){
          // A segment starting before noon belongs to the previous night's sleep bucket
          // (e.g. sleep from 11pm-2am and 2am-7am should both count for the 11pm date).
          var sleepDateKey = dateKey;
          if (sd.getHours() < 12){
            var prev = new Date(sd); prev.setDate(prev.getDate()-1);
            sleepDateKey = todayStr(prev);
          }
          sleepByDate[sleepDateKey] = (sleepByDate[sleepDateKey]||0) + hrs;
        }
      }
    }
  }
  var weightAvgByDate = {};
  Object.keys(weightByDate).forEach(function(d){
    var arr = weightByDate[d];
    weightAvgByDate[d] = Math.round((arr.reduce(function(s,v){return s+v;},0)/arr.length)*10)/10;
  });
  return {
    steps: stepsByDate,
    weight: weightAvgByDate,
    water: waterByDate,
    sleep: sleepByDate
  };
}

function usePersist(key, initial){
  var _s = useState(function(){ return lsGet(key, initial); });
  var state = _s[0], setState = _s[1];
  function setPersisted(v){
    setState(function(prev){
      var next = typeof v === "function" ? v(prev) : v;
      lsSet(key, next);
      return next;
    });
  }
  return [state, setPersisted];
}
/* Like usePersist, but if the key has never been saved before, builds the initial value by
   calling buildInitial() instead of using a flat default — used once, to fold the three
   separate supplement loadout arrays into one tagged library while preserving whatever a
   person already added, edited, or deleted in each one rather than silently resetting them. */
function usePersistMigrated(key, buildInitial){
  var _s = useState(function(){
    var existing = lsGet(key, undefined);
    return existing !== undefined ? existing : buildInitial();
  });
  var state = _s[0], setState = _s[1];
  function setPersisted(v){
    setState(function(prev){
      var next = typeof v === "function" ? v(prev) : v;
      lsSet(key, next);
      return next;
    });
  }
  return [state, setPersisted];
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* Shared color tokens for inline-styled components (onboarding, section intros, undo toast) */
var N = { void:"#030308", surface:"#0a0a14", raised:"#12121e", border:"#1f1f38", borderHi:"#33335c",
  text:"#f0f0ff", ghost:"#9494c0", dim:"#5a5a80",
  green:"#00ffb3", blue:"#00d4ff", pink:"#ff2ee8", violet:"#b347ff", yellow:"#f5ff00", red:"#ff2255" };

/* ══════════════════════════════ Icons ══════════════════════════════ */

  /* Single terse multi-subpath string per icon, matching FLUX Wealth's NAV_ICON_PATHS style. */
  var ICON_PATHS = {
    home: "M3 11.5 12 4l9 7.5 M5.5 10v9.5h13V10",
    book: "M4 4h16v16H4z M12 4v16 M7 8h3 M7 12h3 M14 8h3 M14 12h3",
    hourglass: "M6 2h12 M6 22h12 M6 2c0 5 5 6.5 6 8 1-1.5 6-3 6-8 M6 22c0-5 5-6.5 6-8 1 1.5 6 3 6 8",
    droplet: "M12 2s7 7.5 7 12.5A7 7 0 1 1 5 14.5C5 9.5 12 2 12 2z",
    menu: "M3 6h18 M3 12h18 M3 18h18",
    plus: "M12 5v14 M5 12h14",
    search: "M4 11a7 7 0 1 0 14 0 7 7 0 0 0-14 0z M16 16l5 5",
    x: "M18 6 6 18 M6 6l12 12",
    check: "M20 6 9 17l-5-5",
    trash: "M3 6h18 M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2 M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6",
    clock: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 7v5l3 3",
    chevronRight: "M9 6l6 6-6 6",
    chevronDown: "M6 9l6 6 6-6",
    moon: "M21 12.5A8.5 8.5 0 1 1 11.5 3 7 7 0 0 0 21 12.5z",
    edit: "M12 20h9 M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z",

    calendar: "M4 5h16v15H4z M4 9h16 M8 3v4 M16 3v4 M8 13h3 M8 17h3 M13 13h3 M13 17h3",
    dice: "M4 4h16v16H4z M8 8h.01 M16 8h.01 M12 12h.01 M8 16h.01 M16 16h.01",
    gear: "M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M12 2v3 M12 19v3 M4.2 4.2l2.1 2.1 M17.7 17.7l2.1 2.1 M2 12h3 M19 12h3 M4.2 19.8l2.1-2.1 M17.7 6.3l2.1-2.1",
    fridge: "M5 2h14v20H5z M5 10h14 M9 5v3 M9 13v3",
    refresh: "M21 12a9 9 0 1 1-3-6.7 M21 3v6h-6",
    export: "M12 3v12 M8 7l4-4 4 4 M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7",
    pill: "M10.5 20.5 3.5 13.5a5 5 0 0 1 7-7l7 7a5 5 0 0 1-7 7Z M8 6 18 16",
    dumbbell: "M4 12h16 M7 8v8 M4 9.5v5 M17 8v8 M20 9.5v5"
  };
  var d = ICON_PATHS[name];
  if (!d) return null;
  return h("svg", common,
    gradient ? h("defs", {key:"defs"}, h("linearGradient", { id:gradId, x1:"0%", y1:"0%", x2:"100%", y2:"100%" },
      h("stop", { offset:"0%", stopColor:gradient[0] }),
      h("stop", { offset:"100%", stopColor:gradient[1] })
    )) : null,
    h("path", { d:d })
  );
}

/* ══════════════════════════════ Section Intros ══════════════════════════════ */
/* First-run explainer per screen, shown once ever the first time it's opened.
   Home has its own onboarding flow so it's intentionally not included here. */
var SECTION_INTROS = {
  cookbook: {
    title:"Cookbook", icon:"book", gradient:["#00d4ff","#b347ff"],
    what:"Everywhere you find a recipe — Instagram, TikTok, a random website — lands in one alphabetized, categorized place instead of scattered screenshots.",
    how:["Paste a link or the caption text and it'll sort ingredients from steps automatically", "Tag category, energy level, and diet so the list stays easy to filter", "Open a recipe for Focus Mode — one step at a time, with built-in timers"]
  },
  log: {
    title:"Weight & Water", icon:"droplet", gradient:["#00d4ff","#00ffb3"],
    what:"Quick logging without the friction — and trend lines instead of fixating on a single day's number.",
    how:["Tap a container size to log water in one motion", "Log weight whenever — the chart smooths it into a trend", "No streaks to break, no red flags for a skipped day"]
  },
  planner: {
    title:"Planner", icon:"calendar", gradient:["#b347ff","#00d4ff"],
    what:"A tap-to-assign weekly meal planner built from your own Cookbook, with a grocery list that builds itself from whatever you plan.",
    how:["Tap any meal slot to assign a saved recipe — no typing needed", "The grocery list below fills in automatically from your assigned recipes", "Add extra items by hand for anything outside a recipe"]
  },
  pantry: {
    title:"Pantry & Fridge", icon:"fridge", gradient:["#00ffb3","#b347ff"],
    what:"Log what's actually in stock, and this shows you what's ready to cook right now — plus cheap ways to stretch what you have into something better.",
    how:["Tap staples once — they stay set until you change them", "Add fridge items as you get them; flag anything close to expiring as Eat First", "Check \"What Can I Make?\" for ready-now recipes, near-matches, and simple staple combos with cheap enhancement ideas"]
  },
  reset: {
    title:"Flux Reset", icon:"refresh", gradient:["#00ffb3","#00d4ff"],
    what:"A capped, 30-day structure — no-equipment workouts, a general diet framework, and sleep/timing guidance — built around your own schedule.",
    how:["A quick optional setup (weight, height, work hours) tunes the timing suggestions", "Each day cycles through a workout type — pick Low/Medium/High effort to match your energy", "General wellness info only, not medical advice — check with a doctor before starting"]
  },
  hard75: {
    title:"75 Hard", icon:"flame", gradient:["#ff2255","#ff9500"],
    what:"The real rules, faithfully tracked: this is the strict, all-or-nothing version by design — that's the whole point of the program. Miss one task and the day count restarts at 1.",
    how:["Check off all 6 tasks before the day ends, every day", "Miss one and it resets to Day 1 automatically the next time you open the app", "Your longest streak and attempt count stick around even through a restart"]
  },
  meds: {
    title:"Supplements", icon:"pill", gradient:["#00ffb3","#00d4ff"],
    what:"A simple daily checklist for anything you take — supplements, vitamins, or prescriptions — separate from the 30-day Flux Reset log so it's here whether or not you're running that program.",
    how:["Set how often each one is taken — daily, specific days, or as-needed", "Tap to check off what you've taken today", "General timing info for common OTC supplements only — never dosing guidance, and never for prescriptions"]
  },
  workouts: {
    title:"Workouts", icon:"dumbbell", gradient:["#ff2ee8","#b347ff"],
    what:"No-equipment routines, a HIIT interval timer, and a daily rep log — all in one place for training at home.",
    how:["Check off exercises as you go through a routine — resets fresh each day", "Set your own work/rest/rounds in the HIIT timer and it'll run the whole interval for you", "Log push-ups, sit-ups, pull-ups, and squats any time — totals build up per day"]
  }
};
function useSectionIntro(sectionId){
  var content = SECTION_INTROS[sectionId];
  var storageKey = "sectionIntroSeen_" + sectionId;
  var _s = useState(function(){ return content ? !lsGet(storageKey, false) : false; });
  var show = _s[0], setShow = _s[1];
  function dismiss(){ lsSet(storageKey, true); setShow(false); }
  if (!content || !show) return { sectionIntro:null, introShowing:false };
  var sectionIntro = ReactDOM.createPortal(
    h("div", { className:"overlay", onClick:function(e){ if (e.target===e.currentTarget) dismiss(); } },
      h("div", { className:"sheet", style:{display:"block",maxHeight:"82vh"}, onClick:function(e){ e.stopPropagation(); } },
        h("div", { style:{display:"flex",alignItems:"flex-start",gap:12,marginBottom:16} },
          h("div", { style:{width:44,height:44,borderRadius:12,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",background:N.raised,border:"1px solid "+N.borderHi} },
            h(Icon, { name:content.icon, size:22, gradient:content.gradient })
          ),
          h("div", { style:{flex:1,minWidth:0} },
            h("p", { style:{fontSize:9,color:N.dim,textTransform:"uppercase",letterSpacing:".1em",marginBottom:3} }, "Welcome to"),
            h("h2", { style:{fontFamily:"'Orbitron',system-ui,sans-serif",fontSize:19,fontWeight:800,color:N.text,margin:0} }, content.title)
          ),
          h("button", { onClick:dismiss, style:{background:"rgba(179,71,255,0.1)",border:"1px solid "+N.border,borderRadius:8,color:N.dim,fontSize:16,width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0} }, "✕")
        ),
        h("p", { style:{fontSize:13,color:N.ghost,lineHeight:1.6,marginBottom:16} }, content.what),

  var result = { category:cat };
  if (item.frozenDate){
    result.frozen = true;
    if (cat.freezerDays){
      var qualityBy = addDays(item.frozenDate, cat.freezerDays);
      result.qualityByDate = qualityBy;
      result.daysUntil = daysBetween(today, qualityBy);
    }
    return result;
  }
  var anchorDate = item.openedDate || item.buyDate;
  var span = item.openedDate ? cat.fridgeOpened : cat.fridgeUnopened;
  var useBy = addDays(anchorDate, span);
  result.useByDate = useBy;
  result.daysUntil = daysBetween(today, useBy);
  result.expiringSoon = result.daysUntil <= 3;
  result.pastUse = result.daysUntil < 0;
  return result;
}

  var stepHeaderWord = /\b(instructions?|directions?|steps?|method|how to make( it)?|preparation)\b/i;
  var ingRe = { test:function(l){ return ingHeaderWord.test(l) && l.split(" ").length<=6; } };
  var stepRe = { test:function(l){ return stepHeaderWord.test(l) && l.split(" ").length<=6; } };

  // still ingredients, just grouped — so they're recognized but skipped rather than treated
  // as a mode switch.

  // a Title Case caption on the same line, e.g. "eatwitzo Beef and Broccoli Lo Mein".

/* ══════════════════════════════ Profile Onboarding Wizard ══════════════════════════════
   Base structure adapted from a Flux Fuel reference build, restyled to FLUX Health's own
   dark neon look and wired into its actual data (diet profile, fasting protocols, Flux
   Reset pre-fill). Every field is optional and skippable — matches the app's existing
   low-friction philosophy rather than gatekeeping the app behind a form. */
function generateEatingSchedule(wake, bed, fastingHours){
  var wakeMin = timeToMin(wake); if (wakeMin===null) wakeMin = 7*60;
  var bedMin = timeToMin(bed); if (bedMin===null) bedMin = 22*60;
  var eatStart, eatEnd;
  if (fastingHours){
    // Anchor the eating window to end a bit before bedtime — matches how fasting windows
    // actually get used in practice (e.g. 16:8 as roughly noon-8pm), rather than starting
    // right at wake time, which would make the "16" mostly happen after dinner instead of overnight.
    var eatWindowHours = Math.max(2, 24-fastingHours);
    eatEnd = bedMin - 120;
    eatStart = eatEnd - eatWindowHours*60;
  } else {
    // No fasting: spread meals across the whole day, first meal soon after waking,
    // last meal a couple hours before bed — not compressed into a short window.
    eatStart = wakeMin + 45;
    eatEnd = bedMin - 120;
  }
  var eatWindowMin = eatEnd - eatStart;
  return [
    { id:uid(), name:"Breakfast", time:minToTimeStr(eatStart) },
    { id:uid(), name:"Lunch", time:minToTimeStr(eatStart + Math.round(eatWindowMin*0.42)) },
    { id:uid(), name:"Dinner", time:minToTimeStr(eatStart + Math.round(eatWindowMin*0.9)) }
  ];
}

function formatQtyDisplay(num){
  if (num<=0) return "0";
  if (Math.abs(num - Math.round(num)) < 0.02) return String(Math.round(num));
  var whole = Math.floor(num);
  var frac = num - whole;
  var fracTable = [[0.125,"1/8"],[0.25,"1/4"],[0.333,"1/3"],[0.375,"3/8"],[0.5,"1/2"],[0.625,"5/8"],[0.667,"2/3"],[0.75,"3/4"],[0.875,"7/8"]];
  var closest = fracTable.reduce(function(best,f){ return Math.abs(f[0]-frac)<Math.abs(best[0]-frac) ? f : best; }, fracTable[0]);
  var fracStr = Math.abs(closest[0]-frac)<0.05 ? closest[1] : (Math.round(frac*100)/100);
  return whole>0 ? (whole+" "+fracStr) : String(fracStr);
}
/* Smart Scale — rewrites just the leading quantity on an ingredient line, leaving the rest
   (unit, ingredient name, prep notes) untouched. Reuses the same fraction parser as the
   nutrition estimator so "1/2 cup" and "1 1/2 cups" both scale correctly. */
function scaleIngredientLine(line, ratio){
  var m = String(line).match(/^(\d+\s\d+\/\d+|\d+\/\d+|\d+(\.\d+)?|½|⅓|⅔|¼|¾|⅛)/);
  if (!m) return line;
  var qty = parseLeadingQty(line);
  var scaled = qty * ratio;
  return formatQtyDisplay(scaled) + line.slice(m[0].length);
}
function formatRecipeForShare(recipe){
  var lines = [];
  lines.push(recipe.title.toUpperCase());
  var meta = [];
  if (recipe.servings) meta.push("Serves "+recipe.servings);
  if (recipe.prepTime) meta.push(recipe.prepTime+" min prep");
  if (recipe.marinateTime) meta.push(recipe.marinateTime+"h marinate");
  if (meta.length) lines.push(meta.join(" · "));
  lines.push("");
  lines.push("INGREDIENTS");
  (recipe.ingredients||[]).forEach(function(i){ lines.push("- "+i); });
  lines.push("");
  lines.push("STEPS");
  (recipe.steps||[]).forEach(function(s,i){ lines.push((i+1)+". "+(s.text!==undefined?s.text:s)); });
  lines.push("");
  lines.push((recipe.creatorHandle ? "Recipe by @"+recipe.creatorHandle+" · " : "")+"Shared from FLUX Health");
  return lines.join("\n");
}

/* Reduces decision fatigue by picking from your own saved Cookbook — plain rules, no AI. */
function pickSuggestion(recipes, mode){
  if (!recipes.length) return null;
  var pool = recipes.slice();
  if (mode==="tired" || mode==="forgot"){
    var low = pool.filter(function(r){ return r.energyLevel==="low"; });
    if (low.length) pool = low;
  } else {
    var hr = new Date().getHours();
    var cat = hr<11?"Breakfast":(hr<15?"Lunch":(hr<21?"Dinner":"Snack"));
    var matched = pool.filter(function(r){ return r.category===cat; });
    if (matched.length) pool = matched;
  }
  return pool[Math.floor(Math.random()*pool.length)];
}

function CookbookScreen(props){
  var recipes = props.recipes, openRecipe = props.openRecipe;

  var _cat = useState("All"); var cat = _cat[0], setCat = _cat[1];
  var _q = useState(""); var q = _q[0], setQ = _q[1];
  var _sort = useState("az"); var sort = _sort[0], setSort = _sort[1];
  var _creatorFilter = useState("All"); var creatorFilter = _creatorFilter[0], setCreatorFilter = _creatorFilter[1];

  var distinctCreators = useMemo(function(){
    var seen = {}, out = [];
    recipes.forEach(function(r){ if (r.creatorHandle && !seen[r.creatorHandle]){ seen[r.creatorHandle]=true; out.push(r.creatorHandle); } });
    return out.sort();
  }, [recipes]);

  var filtered = useMemo(function(){
    var list = recipes.slice();

    if (q.trim()) {

    }
    if (sort === "az") list.sort(function(a,b){ return (a.title||"").localeCompare(b.title||""); });

  var grouped = useMemo(function(){

    var map = {};

      var letter = (r.title||"?").trim().charAt(0).toUpperCase() || "?";
      if (!/[A-Z]/.test(letter)) letter = "#";

      })
    ),
    distinctCreators.length>0 && h("div", { className:"chip-row" },
      ["All"].concat(distinctCreators).map(function(c){
        return h("button", { key:c, className:"chip"+(creatorFilter===c?" on":""), onClick:function(){ setCreatorFilter(c); } }, c==="All"?"All Creators":"@"+c);
      })

      h("button", { className:"btn btn-xs "+(sort==="az"?"btn-green":"btn-ghost"), onClick:function(){ setSort("az"); } }, "A–Z"),
      h("button", { className:"btn btn-xs "+(sort==="recent"?"btn-green":"btn-ghost"), onClick:function(){ setSort("recent"); } }, "Recent")
    ),

    filtered.length === 0

          h("div", { className:"empty-state-title" }, "Nothing here yet"),
          h("div", { className:"empty-state-sub" }, "Tap the + button to paste in a recipe from Instagram, TikTok, or any website.")
        )

          return h(React.Fragment, { key:g.letter||"x" },
            g.letter && h("div", { className:"letter-head" }, g.letter),
            g.items.map(function(r){
              return h("div", { key:r.id, className:"recipe-row", onClick:function(){ openRecipe(r.id); } },

                h("div", { style:{flex:1,minWidth:0} },
                  h("div", { className:"recipe-title" }, r.title || "Untitled recipe"),
                  h("div", { className:"recipe-tags" },
                    h("span", { className:"badge badge-dim" }, r.category || "Uncategorized"),

                    r.creatorHandle && h("span", { className:"badge badge-purple" }, "@"+r.creatorHandle),

function WeightChart(props){
  var pts = props.points;
  var w = 300, hgt = 110, pad = 14;
  var vals = pts.map(function(p){return p.weight;});
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (min === max) { min -= 1; max += 1; }
  function x(i){ return pad + (i/(pts.length-1))*(w-pad*2); }
  function y(v){ return hgt-pad - ((v-min)/(max-min))*(hgt-pad*2); }
  var d = pts.map(function(p,i){ return (i===0?"M":"L")+x(i)+","+y(p.weight); }).join(" ");
  return h("div", { className:"chart-wrap" },
    h("svg", { viewBox:"0 0 "+w+" "+hgt, width:"100%", height:hgt },
      h("path", { d:d, fill:"none", stroke:"#00ffb3", strokeWidth:2, strokeLinecap:"round", strokeLinejoin:"round", style:{filter:"drop-shadow(0 0 5px rgba(0,255,179,.5))"} }),
      pts.map(function(p,i){ return h("circle", { key:i, cx:x(i), cy:y(p.weight), r:2.5, fill:"#030308", stroke:"#00ffb3", strokeWidth:1.5 }); })
    ),
    h("div", { style:{display:"flex",justifyContent:"space-between",marginTop:4} },
      h("span", { className:"chart-axis" }, min.toFixed(1)+" lb"),
      h("span", { className:"chart-axis" }, max.toFixed(1)+" lb")
    )
  );
}

function normalizeText(s){ return (s||"").toLowerCase().trim(); }
function inventoryHas(inventoryNames, needleGroup){
  return needleGroup.some(function(need){
    var n = normalizeText(need);
    return inventoryNames.some(function(inv){
      var iv = normalizeText(inv);
      if (!iv) return false;
      return iv.indexOf(n)>-1 || n.indexOf(iv)>-1;
    });
  });
}
function ingredientOwned(ingredientText, inventoryNames){
  var norm = normalizeText(ingredientText);
  return inventoryNames.some(function(inv){
    var iv = normalizeText(inv);
    if (!iv) return false;
    return norm.indexOf(iv)>-1 || iv.indexOf(norm)>-1;
  });
}

/* ══════════════════════════════ Weekly Planner + Grocery List ══════════════════════════════ */
var PLAN_SLOTS = ["Breakfast","Lunch","Dinner","Snack"];

/* "Plan For Me" — fills empty Planner slots using whatever the person has actually told the
   app: their goals from Profile Setup (favor lighter/higher-protein recipes accordingly),
   their diet profile, and what's already in the pantry (prefers recipes that need less
   shopping). Falls back to a simple, still-sensible default (variety + pantry match only)
   if they never set goals — never invents preferences they didn't give it. */
function scoreRecipeForGoals(goals, nutrition, healthGrade){
  if (!goals || !goals.length) return 0;
  var score = 0;
  var wantsLighter = goals.some(function(g){ return ["Lose weight","Blood sugar","Heart health"].indexOf(g)>-1; });
  var wantsProtein = goals.some(function(g){ return ["Gain muscle","Athletic performance"].indexOf(g)>-1; });
  if (wantsLighter){
    if (healthGrade.label==="Lighter") score += 3;
    else if (healthGrade.label==="Balanced") score += 1;
    else if (healthGrade.label==="Indulgent") score -= 2;
  }
  if (wantsProtein && nutrition && nutrition.protein) score += Math.min(3, nutrition.protein/10);
  return score;
}
function generateSmartMealPlan(recipes, days, existingPlan, userProfile, dietProfile, inventory){
  var goals = userProfile ? (userProfile.goals||[]) : [];
  var plan = Object.assign({}, existingPlan);
  var usedRecently = {};
  days.forEach(function(day){
    ["Breakfast","Lunch","Dinner"].forEach(function(slot){
      var key = day.date+"_"+slot;
      if (plan[key]) return; // never overwrite a slot already picked by hand
      var candidates = recipes.filter(function(r){ return r.category===slot; });
      if (!candidates.length) return;
      var scored = candidates.map(function(r){
        var nutrition = estimateNutrition(r.ingredients, r.servings||4);
        var grade = computeHealthGrade(r.ingredients);
        var goalScore = scoreRecipeForGoals(goals, nutrition, grade);
        var dietOk = !dietProfile || dietProfile==="None" || checkDietConflicts(r.ingredients||[], dietProfile).length===0;
        var pantryMatch = (inventory && inventory.length && r.ingredients && r.ingredients.length)
          ? r.ingredients.filter(function(ing){ return ingredientOwned(ing, inventory); }).length / r.ingredients.length
          : 0;
        var varietyPenalty = (usedRecently[r.id]||0) * 2.5;
        return { recipe:r, score: goalScore + pantryMatch*2 + (dietOk?1:-3) - varietyPenalty + Math.random()*0.4 };
      });
      scored.sort(function(a,b){ return b.score-a.score; });
      var picked = scored[0].recipe;
      plan[key] = picked.id;
      usedRecently[picked.id] = (usedRecently[picked.id]||0)+1;
    });
  });
  return plan;
}

function normalizeIngredient(s){ return s.trim().toLowerCase().replace(/\s+/g," "); }

    var inventory = pantryStaples.concat(fridgeItems.map(function(f){ return f.name; }));
    var dietProfile = settings ? settings.dietProfile : "None";
    var next = generateSmartMealPlan(recipes, days, mealPlan, userProfile, dietProfile, inventory);
    setMealPlan(next);
    var usedGoals = userProfile && userProfile.goals && userProfile.goals.length;
    setPlanMsg(usedGoals ? "Filled your week around your goals from setup." : "Filled your week — set goals in Settings → Profile Setup for a more tailored plan.");
    setTimeout(function(){ setPlanMsg(""); }, 4000);
  }

  function assign(dateStr, slot, recipeId){
    var key = dateStr+"_"+slot;
    setMealPlan(Object.assign({}, mealPlan, { [key]: recipeId }));
    setPickerSlot(null);
  }
  function clearSlot(dateStr, slot){
    var key = dateStr+"_"+slot;
    var next = Object.assign({}, mealPlan);
    delete next[key];
    setMealPlan(next);
  }

  var groceryAuto = useMemo(function(){
    var seen = {};
    days.forEach(function(d){
      PLAN_SLOTS.forEach(function(slot){
        var rid = mealPlan[d.date+"_"+slot];
        if (!rid) return;
        var recipe = recipes.find(function(r){ return r.id===rid; });
        if (!recipe) return;
        (recipe.ingredients||[]).forEach(function(ing){
          var norm = normalizeIngredient(ing);
          if (!seen[norm]) seen[norm] = ing;
        });
      });
    });
    return Object.keys(seen).map(function(k){ return { key:k, text:seen[k] }; });
  }, [mealPlan, recipes, days]);

  var groupedGrocery = useMemo(function(){
    var items = groceryAuto.map(function(g){ return { checkedKey:g.key, text:g.text, isExtra:false, aisle:guessAisle(g.text) }; })
      .concat(groceryExtras.map(function(g){ return { checkedKey:g.id, text:g.text, isExtra:true, extraId:g.id, aisle:guessAisle(g.text) }; }));
    var groups = {};
    items.forEach(function(it){ if (!groups[it.aisle]) groups[it.aisle]=[]; groups[it.aisle].push(it); });
    return AISLE_ORDER.filter(function(a){ return groups[a] && groups[a].length; }).map(function(a){ return { aisle:a, items:groups[a] }; });
  }, [groceryAuto, groceryExtras]);

  function toggleChecked(key){ setGroceryChecked(Object.assign({}, groceryChecked, { [key]: !groceryChecked[key] })); }
  function addExtra(){
    if (!newItem.trim()) return;
    setGroceryExtras(groceryExtras.concat([{ id:uid(), text:newItem.trim() }]));
    setNewItem("");
  }
  function removeExtra(id){ setGroceryExtras(groceryExtras.filter(function(e){ return e.id!==id; })); }
  function clearChecked(){
    var next = {};
    Object.keys(groceryChecked).forEach(function(k){ if (!groceryChecked[k]) next[k]=false; });
    setGroceryChecked(next);
  }

  return h("div", { className:"scroll fade-up" },
    si.sectionIntro,
    h("p", { className:"ph-title", style:{marginBottom:4} }, "Planner"),
    h("p", { className:"ph-sub", style:{marginBottom:12} }, "Next 7 days · tap a slot to assign"),

    h("button", { className:"btn btn-green btn-full", style:{marginBottom:8}, onClick:planForMe }, "✨ Plan My Week For Me"),
    planMsg && h("div", { style:{fontFamily:"'Inter',sans-serif",fontSize:11,color:"#9494c0",marginBottom:12,lineHeight:1.5} }, planMsg),
    !planMsg && h("div", { style:{fontFamily:"'Inter',sans-serif",fontSize:10,color:"#5a5a80",marginBottom:16,lineHeight:1.5} }, "Fills empty slots only — anything you've already assigned stays put."),

    days.map(function(d){
      return h("div", { key:d.date, className:"card" },
        h("span", { className:"flux-label" }, d.label+" "+d.dayNum),
        PLAN_SLOTS.map(function(slot){
          var rid = mealPlan[d.date+"_"+slot];
          var recipe = rid ? recipes.find(function(r){ return r.id===rid; }) : null;
          return h("div", { key:slot, style:{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderBottom:slot!==PLAN_SLOTS[PLAN_SLOTS.length-1]?"1px solid #1f1f38":"none"} },
            h("div", { style:{width:60,flexShrink:0,fontFamily:"'Space Grotesk',sans-serif",fontSize:9,fontWeight:700,color:"#5a5a80",textTransform:"uppercase",letterSpacing:".05em"} }, slot),
            h("div", { style:{flex:1,minWidth:0,fontFamily:"'Inter',sans-serif",fontSize:12,color: recipe?"#f0f0ff":"#5a5a80"}, onClick:function(){ setPickerSlot({date:d.date,slot:slot}); } }, recipe ? recipe.title : "Tap to add"),
            recipe && h("button", { className:"btn btn-ghost btn-xs", onClick:function(){ clearSlot(d.date,slot); } }, "✕")
          );
        })
      );
    }),

    h("span", { className:"flux-label" }, "Grocery List"),
    h("div", { className:"card" },
      h("div", { className:"dyn-row" },
        h("input", { className:"fi", placeholder:"Add an item", value:newItem, onChange:function(e){ setNewItem(e.target.value); }, onKeyDown:function(e){ if(e.key==="Enter") addExtra(); } }),
        h("button", { className:"btn btn-green btn-sm", onClick:addExtra }, "Add")
      ),
      groceryAuto.length===0 && groceryExtras.length===0
        ? h("div", { style:{fontFamily:"'Inter',sans-serif",fontSize:12,color:"#5a5a80"} }, "Assign recipes above and their ingredients will show up here automatically.")
        : h("div", null,
            groupedGrocery.map(function(g){
              return h("div", { key:g.aisle, style:{marginBottom:12} },
                h("div", { style:{fontFamily:"'Space Grotesk',sans-serif",fontSize:9,fontWeight:700,color:"#5a5a80",textTransform:"uppercase",letterSpacing:".08em",marginBottom:4} }, g.aisle),
                g.items.map(function(it){
                  return h("div", { key:it.checkedKey, className:"ing-check-row" },
                    h("div", { className:"ing-check"+(groceryChecked[it.checkedKey]?" on":""), onClick:function(){ toggleChecked(it.checkedKey); } }, groceryChecked[it.checkedKey] && h(Icon,{name:"check",size:12})),
                    h("div", { className:"ing-text"+(groceryChecked[it.checkedKey]?" on":""), style:{flex:1}, onClick:function(){ toggleChecked(it.checkedKey); } }, it.text),
                    it.isExtra && h("button", { className:"btn btn-ghost btn-xs", onClick:function(){ removeExtra(it.extraId); } }, "✕")
                  );
                })
              );
            }),
            h("button", { className:"btn btn-ghost btn-sm btn-full", style:{marginTop:10}, onClick:clearChecked }, "Clear Checked")
          )
    ),

    pickerSlot && h("div", { className:"overlay" },
      h("div", { className:"sheet" },
        h("div", { className:"modal-top-bar" }, h("h2", null, pickerSlot.slot), h("button",{className:"btn btn-ghost btn-icon",onClick:function(){setPickerSlot(null);setPickerSearch("");}},h(Icon,{name:"x",size:16}))),
        recipes.length===0
          ? h("div", { style:{fontFamily:"'Inter',sans-serif",fontSize:12,color:"#9494c0"} }, "No saved recipes yet — add some to your Cookbook first.")
          : h("div", null,
              recipes.length>6 && h("input", { className:"fi", placeholder:"Search recipes…", value:pickerSearch, onChange:function(e){ setPickerSearch(e.target.value); }, style:{marginBottom:12} }),
              recipes.slice().filter(function(r){ return !pickerSearch.trim() || (r.title||"").toLowerCase().indexOf(pickerSearch.trim().toLowerCase())>-1; })
                .sort(function(a,b){ return (a.title||"").localeCompare(b.title||""); }).map(function(r){
                return h("div", { key:r.id, className:"recipe-row", onClick:function(){ assign(pickerSlot.date, pickerSlot.slot, r.id); setPickerSearch(""); } },
                  h("div", { className:"recipe-emoji" }, CATEGORY_EMOJI[r.category] || "🍽️"),
                  h("div", { style:{flex:1,minWidth:0} }, h("div", { className:"recipe-title" }, r.title))
                );
              })
            )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(FluxHealthApp, null));
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    var swSrc = "self.addEventListener('fetch',function(e){});";
    try {
      var blob = new Blob([swSrc], {type:'text/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(function(){});
    } catch(e){}
  });
}
window.addEventListener('beforeinstallprompt', function(e){ e.prompt(); });
</script>
</body>
</html>
