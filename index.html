<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

<style>
/* ── Reset & Base (matches FLUX wealth) ─────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;height:-webkit-fill-available;background:#030308;overflow:hidden;}
body{
  height:100vh;height:100dvh;height:-webkit-fill-available;overflow:hidden;
  color:#f0f0ff;font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  overscroll-behavior:none;background:#030308;
}
#root{height:100%;overflow:hidden;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#33335c;border-radius:2px;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
input,select,textarea{-webkit-appearance:none;-moz-appearance:none;border-radius:0;}
*{-webkit-tap-highlight-color:transparent;}
button{cursor:pointer;font-family:inherit;}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideUp{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
.fade-up{animation:fadeUp .28s ease forwards;}
.slide-up{animation:slideUp .32s cubic-bezier(.16,1,.3,1) forwards;}

.app{
  max-width:100%;height:100vh;height:-webkit-fill-available;height:100dvh;margin:0 auto;
  background:#030308;
  background-image:
    radial-gradient(circle at 15% 0%, rgba(179,71,255,0.12) 0%, transparent 45%),
    radial-gradient(circle at 100% 30%, rgba(0,212,255,0.08) 0%, transparent 50%),
    radial-gradient(circle at 0% 100%, rgba(255,46,232,0.07) 0%, transparent 45%);
  display:flex;flex-direction:column;position:relative;overflow:hidden;
}

/* Top bar */
.top-bar{
  position:relative;z-index:250;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 16px) 16px 14px;
  background:rgba(3,3,8,0.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid #1f1f38;flex-shrink:0;
}
.top-bar-word{
  font-family:'Orbitron',system-ui,sans-serif;font-size:16px;font-weight:800;color:#f0f0ff;
  letter-spacing:.6px;display:flex;align-items:center;gap:7px;text-shadow:0 0 14px rgba(0,255,179,0.4);
}
.top-bar-word .sub{font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:600;color:#00ffb3;letter-spacing:.16em;text-transform:uppercase;opacity:.85;}
.top-bar-icon{width:26px;height:26px;flex-shrink:0;filter:drop-shadow(0 0 5px rgba(0,255,179,.6));}
.top-bar-word .top-bar-bolt-svg{width:28px;height:12px;overflow:visible;flex-shrink:0;}
.top-bar-word .top-bar-bolt-svg path{fill:none;stroke-width:9;stroke-linecap:round;stroke-dasharray:60 180;animation:topBarInfinityCycle 5.6s ease-in-out infinite,topBarGlowPulse 5.6s ease-in-out infinite;}
@keyframes topBarInfinityCycle{
  0%{stroke-dasharray:60 180;stroke-dashoffset:0;}
  38%{stroke-dasharray:231 0;stroke-dashoffset:0;}
  50%{stroke-dasharray:231 0;stroke-dashoffset:0;}
  88%{stroke-dasharray:60 180;stroke-dashoffset:-231;}
  100%{stroke-dasharray:60 180;stroke-dashoffset:-240;}
}
@keyframes topBarGlowPulse{0%,100%{filter:drop-shadow(0 0 3px rgba(0,255,179,0.5));}50%{filter:drop-shadow(0 0 8px rgba(255,46,232,0.75));}}
.top-bar-btn{
  width:38px;height:38px;border-radius:12px;border:1px solid #33335c;background:rgba(179,71,255,.1);
  display:flex;align-items:center;justify-content:center;color:#b347ff;
}
.saved-dot{width:6px;height:6px;border-radius:50%;background:#00ffb3;position:fixed;top:18px;right:18px;z-index:260;opacity:0;transition:opacity .3s;box-shadow:0 0 8px #00ffb3;}
.saved-dot.show{opacity:1;}

/* Page header */
.ph{padding:18px 20px 14px;position:relative;}
.ph-title{font-family:'Orbitron',system-ui,sans-serif;font-size:21px;font-weight:800;color:#f0f0ff;letter-spacing:.3px;line-height:1.2;text-shadow:0 0 18px rgba(0,255,179,0.3);}
.ph-sub{font-family:'Space Grotesk',system-ui,sans-serif;font-size:9px;font-weight:500;color:#5a5a80;letter-spacing:.14em;text-transform:uppercase;margin-top:4px;}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 124px;}

/* Bottom dock */
.dock-wrap{position:fixed;left:0;right:0;bottom:0;z-index:190;display:flex;justify-content:center;padding:0 16px calc(18px + env(safe-area-inset-bottom));pointer-events:none;}
.dock{pointer-events:auto;display:flex;align-items:center;gap:4px;background:rgba(18,10,34,0.82);border:1px solid #33335c;border-radius:30px;padding:7px 8px;box-shadow:0 0 0 1px rgba(179,71,255,0.15),0 8px 32px rgba(0,0,0,.6),0 0 24px rgba(179,71,255,0.18);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);max-width:100%;}
.dock-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:56px;height:46px;border-radius:22px;border:none;background:transparent;flex-shrink:0;transition:all .2s;}
.dock-btn-icon{display:flex;align-items:center;justify-content:center;color:#9494c0;filter:drop-shadow(0 0 4px rgba(0,255,179,0.5));}
.dock-btn-label{font-family:'Space Grotesk',sans-serif;font-size:7px;font-weight:700;letter-spacing:.04em;color:#5a5a80;text-transform:uppercase;}
.dock-btn.on .dock-btn-icon{color:#00ffb3;}
.dock-btn.on .dock-btn-label{color:#00ffb3;}
.dock-btn.home{background:linear-gradient(145deg,#00ffb3,#00d4ff);width:54px;height:54px;border-radius:50%;margin:-4px 2px 0;box-shadow:0 0 0 4px rgba(3,3,8,1),0 0 18px rgba(0,255,179,0.65),0 0 36px rgba(0,255,179,0.3);}
.dock-btn.home .dock-btn-icon{color:#030308;filter:none;}
.dock-btn.home .dock-btn-label{display:none;}
.dock-btn.menu{background:rgba(179,71,255,0.12);border:1px solid rgba(179,71,255,0.3);}
.dock-btn.menu .dock-btn-icon{color:#b347ff;filter:drop-shadow(0 0 6px #b347ff);}
.dock-btn.menu.on{background:rgba(179,71,255,0.28);border-color:#b347ff;}
.dock-btn:active{background:rgba(255,255,255,0.06);}

/* Nav rail */
.nav-backdrop{position:fixed;inset:0;z-index:198;background:rgba(2,2,6,.7);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
@keyframes traySlideUp{from{transform:translateY(100%);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes trayHideDown{from{transform:translateY(0);opacity:1;}to{transform:translateY(100%);opacity:0;}}
.nav-rail{position:fixed;left:0;right:0;bottom:0;z-index:199;max-height:70vh;background:linear-gradient(165deg,#0d0d18,#030308);border:1px solid #33335c;border-bottom:none;border-radius:26px 26px 0 0;box-shadow:0 0 0 1px rgba(179,71,255,0.12),0 -8px 40px rgba(0,0,0,.7);padding:14px 0 calc(24px + env(safe-area-inset-bottom));overflow-y:auto;animation:traySlideUp .26s cubic-bezier(.16,1,.3,1) forwards;}
.nav-rail.hiding{animation:trayHideDown .2s ease forwards;}
.nav-rail-handle{width:36px;height:4px;border-radius:3px;background:#33335c;margin:0 auto 14px;}
.nav-rail-title{font-family:'Space Grotesk',sans-serif;font-size:8px;font-weight:700;color:#5a5a80;letter-spacing:.18em;text-transform:uppercase;padding:0 20px 10px;margin-bottom:4px;border-bottom:1px solid #1f1f38;}
.nav-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:10px 12px 4px;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:1px solid transparent;background:none;width:100%;text-align:center;border-radius:16px;transition:background .15s,border-color .15s;}
.nav-item:active{background:rgba(255,255,255,0.04);}
.nav-item.on{border-color:rgba(0,255,179,0.4);background:rgba(0,255,179,0.08);}
.nav-item-icon{display:flex;align-items:center;justify-content:center;color:#9494c0;filter:drop-shadow(0 0 4px rgba(179,71,255,0.35));}

.badge-purple{background:rgba(179,71,255,.1);color:#b347ff;border:1px solid rgba(179,71,255,.3);}
.badge-yellow{background:rgba(245,255,0,.08);color:#f5ff00;border:1px solid rgba(245,255,0,.22);}

/* Recipe import is intentionally a true in-page dialog, not a draggable bottom sheet.
   The app header owns the top of the viewport, so the import dialog starts below it.
   This prevents iOS fixed-position snapping from putting the close button underneath the banner. */
.recipe-import-overlay{

  padding:12px !important;
  box-sizing:border-box !important;
  overflow:hidden !important;
  touch-action:none !important;
}
.recipe-import-sheet{
  width:100% !important;
  max-width:480px !important;
  height:100% !important;
  max-height:none !important;
  min-height:0 !important;
  margin:0 auto !important;
  box-sizing:border-box !important;
  border-radius:20px !important;
  padding:18px 18px calc(28px + env(safe-area-inset-bottom)) !important;
  overflow-y:auto !important;
  overscroll-behavior:contain !important;
  -webkit-overflow-scrolling:touch !important;

}
.recipe-import-sheet .modal-top-bar{
  position:sticky !important;
  top:-18px !important;
  margin:-18px -18px 16px !important;
  padding:18px 18px 12px !important;
}
.recipe-import-sheet .btn-icon{
  min-width:42px !important; min-height:42px !important;
  flex:0 0 42px !important;
  position:relative !important; z-index:30 !important;
  pointer-events:auto !important;
}

  border:1px solid rgba(0,212,255,.2);border-radius:12px;background:rgba(0,212,255,.06);
  font-family:'Inter',sans-serif;font-size:11px;color:#8ddff2;line-height:1.45;
}
.photo-ocr-status.error{border-color:rgba(255,34,85,.28);background:rgba(255,34,85,.06);color:#ff9bb0;}
.photo-ocr-status.success{border-color:rgba(0,255,179,.24);background:rgba(0,255,179,.05);color:#8fffd7;}

/* Integrated mobile UX fixes from the supplemental FLUX Health notes. */
.sheet{padding-bottom:calc(96px + env(safe-area-inset-bottom));}
.rm-btn,.ing-check{padding:12px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;}

.tab.on{background:#0a0a14;color:#00ffb3;border:1px solid rgba(0,255,179,.3);}
.stat-box{background:#0a0a14;border:1px solid #1f1f38;border-radius:12px;padding:13px 14px;}
.neon-num{font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:.2px;}
.flux-label{font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:#00ffb3;margin-bottom:6px;display:block;}

/* Category chip scroller */
.chip-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;-webkit-overflow-scrolling:touch;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid #1f1f38;background:#0a0a14;font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;letter-spacing:.04em;color:#9494c0;white-space:nowrap;}

/* Recipe list */

.recipe-row:active{background:#12121e;border-color:#33335c;}

.dyn-row{display:flex;gap:7px;align-items:center;margin-bottom:8px;}
.dyn-row .fi{flex:1;}
.dyn-row .rm-btn{flex-shrink:0;width:34px;height:34px;border-radius:9px;border:1px solid #1f1f38;background:#0a0a14;color:#ff2255;display:flex;align-items:center;justify-content:center;}
.add-row-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border-radius:10px;border:1px dashed #33335c;background:transparent;color:#9494c0;font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:14px;}

/* Focus mode (recipe detail) */
.focus-step{background:#0a0a14;border:1px solid #1f1f38;border-radius:16px;padding:20px;margin-bottom:12px;}

.timer-chip{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:7px 13px;border-radius:20px;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.35);color:#00d4ff;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;}

.ing-check.on{background:#00ffb3;border-color:#00ffb3;color:#030308;}
.ing-text{font-family:'Inter',sans-serif;font-size:13px;color:#f0f0ff;}
.ing-text.on{color:#5a5a80;text-decoration:line-through;}

/* Fasting ambient ring */
.fast-ring-wrap{display:flex;flex-direction:column;align-items:center;padding:20px 0 6px;}

.fast-ring-sub{font-family:'Space Grotesk',sans-serif;font-size:10px;color:#9494c0;margin-top:10px;text-align:center;line-height:1.6;}
.milestone-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #1f1f38;}

.container-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.container-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:14px;border:1px solid #1f1f38;background:#0a0a14;}
.container-btn:active{background:#12121e;border-color:#00d4ff;}
.water-ring-wrap{display:flex;align-items:center;justify-content:center;padding:10px 0 4px;}
.chart-wrap{background:#0a0a14;border:1px solid #1f1f38;border-radius:14px;padding:14px;}
.chart-axis{font-family:'Space Grotesk',sans-serif;font-size:8px;color:#5a5a80;}

/* Splash */
@keyframes splashFadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes splashFadeOut{0%{opacity:1;}80%{opacity:1;}100%{opacity:0;pointer-events:none;}}

.splash-inner{display:flex;flex-direction:column;align-items:center;animation:splashFadeIn .4s ease forwards;}

.splash-wordmark span{font-family:'Orbitron',sans-serif;font-size:46px;font-weight:800;color:#f0f0ff;letter-spacing:2px;line-height:1;opacity:0;text-shadow:0 0 24px rgba(0,255,179,0.4);}
.splash-f{animation:letterDrop .3s ease .3s forwards;}
.splash-l{animation:letterDrop .3s ease .42s forwards;}
.splash-u{animation:letterDrop .3s ease .54s forwards;}
.splash-x{animation:letterDrop .3s ease .66s forwards;color:#00ffb3;text-shadow:0 0 24px rgba(0,255,179,0.6);}

.splash-bar{width:120px;height:2px;background:#1f1f38;border-radius:1px;overflow:hidden;opacity:0;animation:splashFadeIn .2s ease .9s forwards;}
.splash-progress{height:100%;background:linear-gradient(90deg,#00ffb3,#ff2ee8);border-radius:1px;width:0;animation:barFill 2s ease .8s forwards;box-shadow:0 0 10px #00ffb3;}
.splash-credit{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 22px);left:0;right:0;text-align:center;font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:500;color:#33335c;letter-spacing:.1em;opacity:0;animation:splashFadeIn .4s ease 1.1s forwards;}
.splash-credit span{color:#00ffb3;opacity:.7;}
